name: CD - Production Environment

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read
  actions: read

jobs:
  gate-check:
    runs-on: ubuntu-latest
    steps:
    - name: Verify QA Pipeline Success
      run: |
        echo "Checking if commit ${{ github.sha }} successfully passed QA pipeline..."
        URL="https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success"
        RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$URL")
        
        # Filtrar si la corrida de QA fue exitosa
        QA_PASSED=$(echo "$RUNS" | jq '.workflow_runs[] | select(.name == "CD - QA Environment")')
        
        if [ -z "$QA_PASSED" ]; then
          echo "❌ ERROR: Este commit no ha pasado el workflow 'CD - QA Environment' con éxito."
          echo "Por favor, despliega y valida en 'QA' antes de promocionar a Producción."
          exit 1
        else
          echo "✅ Validación de QA completada con éxito."
        fi

  check-image:
    needs: gate-check
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
    - name: Check if Docker image already exists on Docker Hub
      id: check
      run: |
        IMAGE_TAG="sha-${{ github.sha }}"
        echo "Checking for tag: $IMAGE_TAG"
        URL="https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/centraleats-backend/tags/$IMAGE_TAG/"
        if curl -s -f -o /dev/null "$URL"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✅ La imagen ya existe en Docker Hub. Reutilizaremos esta imagen."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "ℹ️ La imagen no existe. Se requiere compilación."
        fi

  build-new:
    needs: check-image
    if: needs.check-image.outputs.exists != 'true'
    uses: ./.github/workflows/build-push.yml
    with:
      image_tag: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  tag-existing:
    needs: check-image
    if: needs.check-image.outputs.exists == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Tag and Push Existing Image
      run: |
        PRIMARY_TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}"
        echo "Tagging existing sha-${{ github.sha }} image as $PRIMARY_TAG..."
        docker pull ${{ secrets.DOCKERHUB_USERNAME }}/centraleats-backend:sha-${{ github.sha }}
        docker tag ${{ secrets.DOCKERHUB_USERNAME }}/centraleats-backend:sha-${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/centraleats-backend:$PRIMARY_TAG
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/centraleats-backend:$PRIMARY_TAG

  deploy:
    needs: [ check-image, build-new, tag-existing ]
    if: always() && needs.check-image.result == 'success' && (needs.build-new.result == 'success' || needs.build-new.result == 'skipped') && (needs.tag-existing.result == 'success' || needs.tag-existing.result == 'skipped')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: sha-${{ github.sha }}
      container_name: centraleats-prod
      host_port: "3000"
    secrets:
      EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
      EC2_USER: ${{ secrets.PROD_EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
      NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}

  trigger-frontend-deploy:
    needs: deploy
    if: secrets.FRONTEND_DEPLOY_TOKEN != '' && secrets.FRONTEND_REPO != ''
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Frontend Deployment Workflow
      run: |
        echo "Backend deployed successfully. Triggering frontend workflow..."
        curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.FRONTEND_DEPLOY_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/${{ secrets.FRONTEND_REPO }}/dispatches \
          -d '{"event_type": "backend-deployed", "client_payload": { "status": "success", "tag": "latest" }}'
