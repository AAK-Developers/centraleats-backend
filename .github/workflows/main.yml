name: CD - Production Environment

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  create-tag-and-release:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag_version.outputs.new_tag }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Bump version and push tag
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        default_bump: patch

    - name: Create a GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag_version.outputs.new_tag }}
        name: Release ${{ steps.tag_version.outputs.new_tag }}
        body: ${{ steps.tag_version.outputs.changelog }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-image:
    needs: [ci, create-tag-and-release]
    runs-on: ubuntu-latest
    steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Promote QA Image to Production
      run: |
        IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/centraleats-backend"
        NEW_TAG="${{ needs.create-tag-and-release.outputs.new_tag }}"
        
        echo "Pulling QA image from Docker Hub..."
        docker pull ${IMAGE_NAME}:qa
        
        echo "Tagging image locally with tag ${NEW_TAG} and latest..."
        docker tag ${IMAGE_NAME}:qa ${IMAGE_NAME}:${NEW_TAG}
        docker tag ${IMAGE_NAME}:qa ${IMAGE_NAME}:latest
        
        echo "Pushing tags to Docker Hub..."
        docker push ${IMAGE_NAME}:${NEW_TAG}
        docker push ${IMAGE_NAME}:latest

  deploy:
    needs: [create-tag-and-release, promote-image]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.create-tag-and-release.outputs.new_tag }}
      container_name: centraleats-prod
      host_port: "3000"
    secrets:
      EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
      EC2_USER: ${{ secrets.PROD_EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.PROD_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.PROD_CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.PROD_CLERK_WEBHOOK_SECRET }}
      FRONTEND_URL: ${{ secrets.PROD_FRONTEND_URL }}
      SUPABASE_PROJECT_URL: ${{ secrets.PROD_SUPABASE_PROJECT_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
      NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}

  trigger-frontend-deploy:
    needs: [create-tag-and-release, deploy]
    runs-on: ubuntu-latest
    steps:
    - name: Trigger Frontend Deployment Workflow
      run: |
        if [ -n "${{ secrets.FRONTEND_DEPLOY_TOKEN }}" ] && [ -n "${{ secrets.FRONTEND_REPO }}" ]; then
          echo "Backend deployed successfully. Triggering frontend workflow..."
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FRONTEND_DEPLOY_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ secrets.FRONTEND_REPO }}/dispatches \
            -d '{"event_type": "backend-deployed", "client_payload": { "status": "success", "tag": "${{ needs.create-tag-and-release.outputs.new_tag }}" }}'
        else
          echo "Frontend deploy secrets not configured. Skipping trigger."
        fi
