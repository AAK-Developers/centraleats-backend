name: CD - Production

on:
  push:
    branches: [ main ]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/centraleats-backend:latest

    - name: Deploy to EC2 Production
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PROD_EC2_HOST }}
        username: ${{ secrets.PROD_EC2_USER }}
        key: ${{ secrets.PROD_EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/centraleats-backend:latest
          docker stop centraleats-prod || true
          docker rm centraleats-prod || true
          docker run -d --name centraleats-prod \
            -p 3000:3000 \
            -e PORT=3000 \
            -e NODE_ENV=production \
            -e FRONTEND_URL=${{ secrets.PROD_FRONTEND_URL }} \
            -e DATABASE_URL="${{ secrets.PROD_DATABASE_URL }}" \
            -e DIRECT_URL="${{ secrets.PROD_DIRECT_URL }}" \
            -e CLERK_PUBLISHABLE_KEY=${{ secrets.CLERK_PUBLISHABLE_KEY }} \
            -e CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }} \
            -e CLERK_WEBHOOK_SECRET=${{ secrets.CLERK_WEBHOOK_SECRET }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/centraleats-backend:latest
          docker exec -e DIRECT_URL="${{ secrets.PROD_DIRECT_URL }}" centraleats-prod npx prisma migrate deploy
