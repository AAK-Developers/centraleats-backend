name: CD - QA Environment

on:
  push:
    branches: [ QA ]

permissions:
  contents: read
  actions: read

jobs:
  gate-check:
    runs-on: ubuntu-latest
    steps:
    - name: Verify Dev Pipeline Success
      run: |
        echo "Checking if commit ${{ github.sha }} successfully passed Dev pipeline..."
        URL="https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&status=success"
        RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$URL")
        
        # Filtrar si la corrida de desarrollo fue exitosa
        DEV_PASSED=$(echo "$RUNS" | jq '.workflow_runs[] | select(.name == "CI/CD - Dev Environment")')
        
        if [ -z "$DEV_PASSED" ]; then
          echo "❌ ERROR: Este commit no ha pasado el workflow 'CI/CD - Dev Environment' con éxito."
          echo "Por favor, despliega y valida en 'dev' antes de fusionar a QA."
          exit 1
        else
          echo "✅ Validación de Desarrollo completada con éxito."
        fi

  check-image:
    needs: gate-check
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
    - name: Check if Docker image already exists on Docker Hub
      id: check
      run: |
        IMAGE_TAG="sha-${{ github.sha }}"
        echo "Checking for tag: $IMAGE_TAG"
        URL="https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/centraleats-backend/tags/$IMAGE_TAG/"
        if curl -s -f -o /dev/null "$URL"; then
          echo "exists=true" >> $GITHUB_OUTPUT
          echo "✅ La imagen ya existe en Docker Hub. Saltaremos la compilación."
        else
          echo "exists=false" >> $GITHUB_OUTPUT
          echo "ℹ️ La imagen no existe. Se requiere compilación."
        fi

  build:
    needs: check-image
    if: needs.check-image.outputs.exists != 'true'
    uses: ./.github/workflows/build-push.yml
    with:
      image_tag: qa
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy:
    needs: [ check-image, build ]
    if: always() && needs.check-image.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: qa
      image_tag: sha-${{ github.sha }}
      container_name: centraleats-qa
      host_port: "3001"
    secrets:
      EC2_HOST: ${{ secrets.QA_EC2_HOST }}
      EC2_USER: ${{ secrets.QA_EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.QA_EC2_SSH_KEY }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DATABASE_URL: ${{ secrets.QA_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.QA_DIRECT_URL }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
      FRONTEND_URL: ${{ secrets.QA_FRONTEND_URL }}
      NOTIFICATION_WEBHOOK_URL: ${{ secrets.NOTIFICATION_WEBHOOK_URL }}
